server:
  port: 8080

spring:
  application:
    name: franquicia-api
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:franquicia_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
  sql:
    init:
      mode: always

aws:
  endpoint: ${AWS_ENDPOINT:}
  region: ${AWS_REGION:us-east-1}
  secrets:
    name: ${AWS_SECRET_NAME:/accenture/dev/db-credentials}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always