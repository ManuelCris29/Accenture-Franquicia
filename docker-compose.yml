services:

  mysql:
    image: mysql:8.4
    container_name: franquicia-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  localstack:
    image: localstack/localstack:3.0.0
    container_name: franquicia-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=secretsmanager
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${DB_NAME}
      - AWS_SECRET_NAME=${AWS_SECRET_NAME}
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  localstack-init:
    image: localstack/localstack:3.0.0
    container_name: franquicia-localstack-init
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_SECRET_NAME=${AWS_SECRET_NAME:-/accenture/dev/db-credentials}
      - MYSQL_USER=${MYSQL_USER:-admin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-franquicia_db}
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: ["sh", "-c", "awslocal --endpoint-url=http://localstack:4566 secretsmanager create-secret --name $${AWS_SECRET_NAME} --secret-string '{\"username\":\"'$${MYSQL_USER}'\",\"password\":\"'$${MYSQL_PASSWORD}'\",\"host\":\"mysql\",\"port\":\"3306\",\"dbname\":\"'$${DB_NAME}'\"}' && echo 'Secreto creado'"]
    restart: "no"

  franquicia-api:
    build: .
    container_name: franquicia-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      AWS_ENDPOINT: ${AWS_ENDPOINT}
      AWS_REGION: ${AWS_REGION}
      AWS_SECRET_NAME: ${AWS_SECRET_NAME}
    depends_on:
      mysql:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully

volumes:
  mysql_data:
  localstack_data: