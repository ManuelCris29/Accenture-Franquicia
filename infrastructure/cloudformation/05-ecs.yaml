AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Fargate + ALB para Franquicia API

Parameters:
  Environment:
    Type: String
    Default: dev
  ImageUri:
    Type: String
    Description: URI de la imagen en ECR

Resources:
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub franquicia-ecs-execution-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !ImportValue
                  Fn::Sub: franquicia-db-secret-arn-${Environment}

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group para ALB
      VpcId: !ImportValue
        Fn::Sub: franquicia-vpc-id-${Environment}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group para ECS Fargate
      VpcId: !ImportValue
        Fn::Sub: franquicia-vpc-id-${Environment}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub franquicia-alb-${Environment}
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue
          Fn::Sub: franquicia-subnet-public-a-${Environment}
        - !ImportValue
          Fn::Sub: franquicia-subnet-public-b-${Environment}
      SecurityGroups:
        - !Ref ALBSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub franquicia-tg-${Environment}
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !ImportValue
        Fn::Sub: franquicia-vpc-id-${Environment}
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub franquicia-cluster-${Environment}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/franquicia-api-${Environment}
      RetentionInDays: 7

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub franquicia-api-${Environment}
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: franquicia-api
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: DB_HOST
              Value: !ImportValue
                Fn::Sub: franquicia-rds-endpoint-${Environment}
            - Name: DB_PORT
              Value: '3306'
            - Name: DB_NAME
              Value: franquicia_db
            - Name: AWS_REGION
              Value: us-east-1
            - Name: AWS_SECRET_NAME
              Value: !Sub /accenture/${Environment}/db-credentials
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub /ecs/franquicia-api-${Environment}
              awslogs-region: us-east-1
              awslogs-stream-prefix: franquicia

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub franquicia-api-service-${Environment}
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !ImportValue
              Fn::Sub: franquicia-subnet-private-a-${Environment}
            - !ImportValue
              Fn::Sub: franquicia-subnet-private-b-${Environment}
          SecurityGroups:
            - !Ref ECSSecurityGroup
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: franquicia-api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  LoadBalancerURL:
    Value: !Sub http://${ALB.DNSName}
    Export:
      Name: !Sub franquicia-api-url-${Environment}